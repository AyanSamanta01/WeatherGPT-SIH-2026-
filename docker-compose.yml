version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: weathergpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
      POSTGRES_DB: weathergpt_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weathergpt_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weathergpt_network

  # -------------------------------------------------------------
  # 2. Local ML Inference & Reasoning Engine (FastAPI - Port 8000)
  #    Runs 100% locally with XGBoost & LightGBM pre-trained models
  # -------------------------------------------------------------
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: weathergpt_ml_service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - weathergpt_network

  # -------------------------------------------------------------
  # 3. GIS & Spatial Alerts Subsystem (FastAPI - Port 8002)
  # -------------------------------------------------------------
  gis-alerts:
    build:
      context: ./gis-alerts
      dockerfile: Dockerfile
    container_name: weathergpt_gis_alerts
    restart: unless-stopped
    environment:
      PORT: 8002
      HOST: 0.0.0.0
    ports:
      - '8002:8001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - weathergpt_network

  # -------------------------------------------------------------
  # 4. Node.js Express API Gateway (Port 5000)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://weather_user:weather_password@postgres:5432/weathergpt_db
      AI_SERVICE_URL: http://ml-service:8000
      GIS_SERVICE_URL: http://gis-alerts:8001
      JWT_SECRET: weathergpt_super_secure_jwt_secret_sih_2026_key
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
      gis-alerts:
        condition: service_started
    networks:
      - weathergpt_network

  # -------------------------------------------------------------
  # 5. React / Vite Web Frontend (Port 3000 / 80)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weathergpt_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - weathergpt_network

volumes:
  postgres_data:
    driver: local

networks:
  weathergpt_network:
    driver: bridge
