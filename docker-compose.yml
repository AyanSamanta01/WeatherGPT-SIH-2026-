version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weathergpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
      POSTGRES_DB: weathergpt_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weathergpt_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - weathergpt_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: weathergpt_ai_service
    restart: unless-stopped
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      AI_PROVIDER: fallback
      BACKEND_API_URL: http://backend:5000/api/v1
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173"
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - weathergpt_network

  gis-alerts:
    build:
      context: ./gis-alerts
      dockerfile: Dockerfile
    container_name: weathergpt_gis_alerts
    restart: unless-stopped
    environment:
      PORT: 8001
      HOST: 0.0.0.0
      LOG_LEVEL: INFO
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173"
    ports:
      - '8001:8001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - weathergpt_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://weather_user:weather_password@postgres:5432/weathergpt_db
      AI_SERVICE_URL: http://ai-service:8000
      GIS_SERVICE_URL: http://gis-alerts:8001
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173"
      JWT_SECRET: weathergpt_super_secure_jwt_secret_sih_2026_key
      SEED_DATABASE: "true"
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      gis-alerts:
        condition: service_started
    networks:
      - weathergpt_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: weathergpt_frontend
    restart: unless-stopped
    ports:
      - '80:80'
      - '5173:80'
    depends_on:
      - backend
    networks:
      - weathergpt_network

volumes:
  postgres_data:
    driver: local

networks:
  weathergpt_network:
    driver: bridge
