version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weathergpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
      POSTGRES_DB: weathergpt_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_user -d weathergpt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: weathergpt_ai_service
    restart: unless-stopped
    environment:
      - PORT=8000
      - AI_PROVIDER=fallback
      - BACKEND_API_URL=http://backend:5000/api/v1
    ports:
      - '8000:8000'
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weathergpt_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://weather_user:weather_password@postgres:5432/weathergpt_db
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=weathergpt_super_secure_jwt_secret_sih_2026_key
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  postgres_data:
    driver: local
