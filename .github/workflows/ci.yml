name: WeatherGPT CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'Ml-model'
  pull_request:
    branches:
      - main

jobs:
  # =========================================================================
  # 1. Weather-ML & AI Microservice Test Battery
  # =========================================================================
  python-ml-and-ai-tests:
    name: ML Models & AI-Service Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Core ML Inference Tests
        run: python test_inference.py

      - name: Run Meteorological Risk & Hazard Engine Tests
        run: python test_risk_engine.py

      - name: Run Live Telemetry & Dynamic Lag Pipeline Tests
        run: python test_live_pipeline.py

      - name: Run NWP Multi-Model Consensus & Anomaly Tests
        run: python test_nwp_consensus.py

      - name: Run FastAPI ML Microservice Endpoint Tests
        run: python test_api_server.py

      - name: Run AI-Service Autonomous ReAct Agent Pytest Battery (34 Tests)
        working-directory: ./ai-service
        run: pytest tests/ -v

  # =========================================================================
  # 2. Node.js Express Backend API Tests
  # =========================================================================
  backend-tests:
    name: Backend API & Gateway Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend API Test Suite
        run: npm test

  # =========================================================================
  # 3. React / Vite Frontend Production Build Verification
  # =========================================================================
  frontend-build:
    name: React Frontend Build & Asset Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Vite Production Bundle
        run: npm run build
