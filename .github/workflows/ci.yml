name: WeatherGPT CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'Ml-model'
      - 'ai-service'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  # =========================================================================
  # 1. Backend Node.js / Express / Prisma API Test Suite
  # =========================================================================
  backend-tests:
    name: Backend API & Gateway Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend API Test Suite (34 Tests)
        run: npm test

  # =========================================================================
  # 2. AI / LLM Microservice Pytest Suite
  # =========================================================================
  ai-service-tests:
    name: AI/LLM Microservice (FastAPI & ReAct Agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt

      - name: Run AI Microservice Pytest Suite (34 Tests)
        run: pytest tests/ -v

  # =========================================================================
  # 3. Weather-ML Pipeline, Risk Engine & NWP Consensus Tests
  # =========================================================================
  weather-ml-tests:
    name: ML 6h Forecasting & NWP Consensus Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML & API Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Master Dataset from City CSVs (if missing)
        run: |
          python -c "
          import os, glob, pandas as pd
          master_file = 'dataset/WeatherGPT_10_Cities_V3_Master.csv'
          if not os.path.exists(master_file):
              print('Master CSV not present. Combining committed city CSVs...')
              city_csvs = [f for f in glob.glob('dataset/*_V3.csv') if not os.path.basename(f).startswith('V3_')]
              if city_csvs:
                  dfs = [pd.read_csv(f, nrows=200) for f in city_csvs]
                  combined = pd.concat(dfs, ignore_index=True)
                  combined.to_csv(master_file, index=False)
                  print(f'Reconstructed test master dataset at {master_file} with shape {combined.shape}')
          "

      - name: Test Production ML Prediction Across 10 Cities
        run: python test_inference.py

      - name: Test IMD Extreme-Weather Risk Engine
        run: python test_risk_engine.py

      - name: Test Live Open-Meteo Feature Telemetry Pipeline
        run: python test_live_pipeline.py

      - name: Test NWP Multi-Model Consensus (ECMWF, GFS, ICON)
        run: python test_nwp_consensus.py

      - name: Test ML FastAPI Server Endpoints
        run: python test_api_server.py

  # =========================================================================
  # 4. React / Vite Frontend Production Bundle Build Verification
  # =========================================================================
  frontend-build:
    name: Frontend React/Vite Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build
